<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  :root{ --a:#8a68e9; --bg:#17151d; --card:#211e2a; --line:#322e3e; --ink:#ece8f5; --dim:#948da6; }
  *{box-sizing:border-box}
  body{margin:0;width:380px;background:var(--bg);color:var(--ink);
       font:13px/1.55 -apple-system,system-ui,"Segoe UI",sans-serif}
  header{padding:14px 16px 12px;border-bottom:1px solid var(--line)}
  h1{margin:0;font-size:14px;font-weight:700}
  .sub{margin:2px 0 0;color:var(--dim);font-size:12px}
  main{padding:14px 16px 16px}
  label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--dim);margin:0 0 5px}
  select{width:100%;padding:8px 10px;border-radius:9px;border:1px solid var(--line);
         background:#1a1822;color:var(--ink);font:inherit;margin-bottom:12px}
  button{width:100%;border:0;border-radius:10px;padding:12px;cursor:pointer;
         font:600 13px/1 inherit;color:#fff;background:var(--a);margin-bottom:8px}
  button.ghost{background:#2c2836;color:#ddd6ea}
  button:hover:not(:disabled){filter:brightness(1.14)}
  button:disabled{opacity:.45;cursor:default}
  .steps{margin:10px 0 0;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:#1b1924}
  .steps b{color:#fff}
  .steps ol{margin:6px 0 0;padding-left:17px;color:var(--dim)}
  .steps li{margin:3px 0}
  pre{margin:12px 0 0;padding:10px;border-radius:9px;background:#100e16;border:1px solid var(--line);
      font:11px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre-wrap;word-break:break-word;
      max-height:180px;overflow:auto;color:var(--dim)}
  .ok{color:#79e6a4} .err{color:#ff93a3} .warn{color:#ffd479}
</style>
</head>
<body>
<header>
  <h1>Hackuity Navbar → Webflow</h1>
  <p class="sub">Hands the payload to the Designer from inside the page.</p>
</header>
<main>
  <label for="which">Payload</label>
  <select id="which">
    <option value="navbar.json">Navbar — 194 nodes, 4 roots</option>
    <option value="navbar-singleroot.json">Navbar — 195 nodes, single root</option>
    <option value="control.json">Control — 3 nodes (transport test)</option>
  </select>

  <button id="arm">1 · Arm paste (all frames)</button>
  <button id="synth" class="ghost" disabled>2 · Fire synthetic paste (fallback)</button>
  <button id="diag" class="ghost">Diagnose frames</button>
  <button id="find" class="ghost">Find Webflow's clipboard store</button>
  <button id="disarm" class="ghost" disabled>Disarm now</button>

  <div class="steps">
    <b>After arming</b>
    <ol>
      <li>Click the Webflow <b>canvas</b></li>
      <li>Press <b>Cmd + V</b></li>
      <li>If nothing lands, use button 2</li>
    </ol>
  </div>

  <pre id="log">Open the Webflow Designer, then Arm.</pre>
</main>
<script src="popup.js"></script>
</body>
</html>
